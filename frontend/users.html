<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - APISec Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .users-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .users-table th, .users-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    .users-table th { color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .users-table tr:hover { background: rgba(255,255,255,0.02); }
    .role-select { background: var(--bg-dark); color: var(--text-primary); border: 1px solid var(--border-color); padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.875rem; }
    .status-badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .status-active { background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .status-inactive { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-shield-halved"></i>
        <span>APISec Platform</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">
          <i class="fa-solid fa-house"></i>
          <span>Dashboard</span>
        </a>
        <a href="#" class="sidebar-link nav-coming-soon">
          <i class="fa-solid fa-folder-open"></i>
          <span>Projects</span>
        </a>
        <a href="#" class="sidebar-link nav-coming-soon">
          <i class="fa-solid fa-bullseye"></i>
          <span>Targets</span>
        </a>
        <a href="#" class="sidebar-link nav-coming-soon">
          <i class="fa-solid fa-network-wired"></i>
          <span>API Inventory</span>
        </a>
        <a href="#" class="sidebar-link nav-coming-soon">
          <i class="fa-solid fa-play"></i>
          <span>Scans</span>
        </a>
        <a href="#" class="sidebar-link nav-coming-soon">
          <i class="fa-solid fa-bug"></i>
          <span>Findings</span>
        </a>
        <a href="#" class="sidebar-link nav-coming-soon">
          <i class="fa-solid fa-chart-bar"></i>
          <span>Reports</span>
        </a>
      </nav>

      <!-- Admin only section -->
      <div class="admin-only" style="padding: 0 0.75rem; margin-top: 0.5rem;">
        <div style="font-size:0.65rem; text-transform:uppercase; letter-spacing:0.1em; color:#7c3aed; padding: 0.5rem 0.75rem; font-weight:700;">
          Admin Panel
        </div>
        <a href="users.html" class="sidebar-link active" style="color:#c084fc;">
          <i class="fa-solid fa-users-gear"></i>
          <span>User Management</span>
        </a>
        <a href="#" class="sidebar-link nav-coming-soon" style="color:#c084fc;">
          <i class="fa-solid fa-sliders"></i>
          <span>Platform Settings</span>
        </a>
        <a href="#" class="sidebar-link nav-coming-soon" style="color:#c084fc;">
          <i class="fa-solid fa-scroll"></i>
          <span>Audit Logs</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="user-info" onclick="window.location.href='profile.html'" style="cursor:pointer">
          <div class="user-avatar" id="sidebar-avatar">U</div>
          <div style="overflow: hidden;">
            <div class="font-semibold text-sm truncate" id="sidebar-name">User Name</div>
            <div id="sidebar-role-badge"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-brand">
          <h2>User Management (RBAC)</h2>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-outline btn-sm" onclick="handleLogout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
          </button>
        </div>
      </header>

      <div style="padding: 2rem;">
        <div class="glass-card fade-in">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h3 class="card-title">All Users</h3>
            <button class="btn btn-primary btn-sm" onclick="loadUsers()">
              <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
          </div>
          
          <div style="overflow-x: auto;">
            <table class="users-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <tr><td colspan="6" style="text-align:center;">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
